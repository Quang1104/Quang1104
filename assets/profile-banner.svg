<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="252" viewBox="0 0 1120 252" role="img" aria-labelledby="title description">
  <title id="title">Quang Xuan Nguyen</title>
  <desc id="description">AI / Machine Learning Engineer. A blue and green banner with a terminal running a Python program that prints Hello World!</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .command {
        animation: type-command 1s steps(15, end) .2s both;
      }
      .result {
        animation: show-result .01s 1.24s both;
      }
      .cursor {
        animation: blink-cursor .7s step-end 1.25s 3 backwards;
      }
    }
    @keyframes type-command {
      from { clip-path: inset(0 100% 0 0) fill-box; }
      to { clip-path: inset(0) fill-box; }
    }
    @keyframes show-result {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes blink-cursor {
      0% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="22%">
      <stop offset="0%" stop-color="#102b62"/>
      <stop offset="50%" stop-color="#10558b"/>
      <stop offset="100%" stop-color="#09634c"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop offset="0%" stop-color="#a5d7ff"/>
      <stop offset="100%" stop-color="#92edbc"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="252" rx="24" fill="url(#background)"/>
  <rect x="56" y="54" width="54" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="56" y="134" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">Quang Xuan Nguyen</text>
  <text x="58" y="181" fill="#d6f7ed" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="500">AI / Machine Learning Engineer</text>
  <g font-family="Consolas, Courier New, monospace" font-size="18">
    <rect x="749" y="65" width="322" height="133" rx="15" fill="#0b2940" opacity=".46"/>
    <rect x="742" y="59" width="322" height="133" rx="15" fill="#102f45" stroke="#99dfc8" stroke-opacity=".54"/>
    <path d="M743 96h320" stroke="#99dfc8" stroke-opacity=".3"/>
    <circle cx="765" cy="78" r="3.5" fill="#92edbc"/>
    <circle cx="778" cy="78" r="3.5" fill="#a5d7ff"/>
    <circle cx="791" cy="78" r="3.5" fill="#fff" opacity=".64"/>
    <text x="903" y="83" fill="#c4e0ea" text-anchor="middle" font-size="13">Terminal</text>
    <text x="766" y="122" fill="#92edbc">$</text>
    <text class="command" x="788" y="122" fill="#fff"><tspan fill="#a5d7ff">python</tspan> hello.py</text>
    <g class="result" fill="#92edbc">
      <text x="766" y="147">Hello World!</text>
      <text x="766" y="173">$</text>
      <rect class="cursor" x="788" y="159" width="8" height="16" rx="1"/>
    </g>
  </g>
</svg>
