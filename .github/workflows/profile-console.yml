name: Profile console

on:
  push:
    paths:
      - '.github/workflows/profile-console.yml'
      - 'scripts/console-profile.json'
      - 'scripts/render-console.py'
      - 'assets/terminal-profile*.svg'
  pull_request:
    paths:
      - '.github/workflows/profile-console.yml'
      - 'scripts/console-profile.json'
      - 'scripts/render-console.py'
      - 'assets/terminal-profile*.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify generated banners
        run: python3 scripts/render-console.py --check
